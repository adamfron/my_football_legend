name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Keep every verify stage and its time limits. Fixed-budget native integration
    # and full career fixtures get fresh workers alongside the unit/build group.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: main
            command: npm run lint && npm run test:unit && npm run build
          - group: integration
            command: npm run generate:world-db && npm run test:match-integration
          - group: career
            command: npm run generate:world-db && npm run test:match-contract && npm run test:full-career
    env:
      # Simulation parity tests keep their original time limits on a shared CPU.
      VITEST_MAX_WORKERS: '1'
      # Canonical fixed-tick fixtures allocate many short-lived state objects.
      # Give V8 more young-generation space; preserve every test and wall budget.
      NODE_OPTIONS: '--max-semi-space-size=64'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - if: matrix.group == 'main'
        run: npm run benchmark:pr186:replay && npm run benchmark:pr187:replay && npm run benchmark:pr188:replay && npm run benchmark:pr189:replay && npm run benchmark:pr190:replay && npm run benchmark:pr191:baseline && npm run benchmark:pr192:baseline && npm run benchmark:pr193:baseline && npm run benchmark:pr194:baseline && npm run benchmark:pr193:replay && npm run benchmark:pr196:historical && git diff --exit-code -- docs/performance
      - if: matrix.group == 'main'
        run: test -f dist/data/world/pl-2026-v2.json
      - if: matrix.group == 'main'
        run: npm run benchmark:pr195:check && git diff --exit-code -- docs/performance/pr195 docs/match-engine
      - if: matrix.group == 'main'
        run: npm run benchmark:pr196:check && npm run benchmark:pr196:replay && git diff --exit-code -- docs/performance/pr196 docs/match-engine
  quality:
    # Preserve the existing required check and fail it if either group fails,
    # times out or is cancelled, including failures before tests can start.
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every verification group
        env:
          VERIFY_RESULT: ${{ needs.checks.result }}
        run: test "$VERIFY_RESULT" = success
