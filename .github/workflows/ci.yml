name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    # Main + restart + two full canonical fixtures exceed 15 minutes in series.
    # Keep individual test timeouts; allow the complete verify pipeline to finish.
    timeout-minutes: 30
    env:
      # Simulation parity tests keep their original time limits on a shared CPU.
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: test -f dist/data/world/pl-2026-v2.json
