name: PR202 source packing parity
on:
  pull_request:
concurrency:
  group: pr202-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-parity:
    name: Source packing parity (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
        group: [source-01, source-02, source-03, source-04]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run ci:manifest
      - run: npm run ci:contracts
      - run: npm run ci:group -- --group=${{ matrix.group }} --platform-parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr202-parity-${{ matrix.os }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: .benchmark-artifacts/pr202
          if-no-files-found: error
