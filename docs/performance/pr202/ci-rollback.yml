name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: verify (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Keep every verify stage and its time limits. Fixed-budget native integration
    # and full career fixtures get fresh workers alongside the unit/build group.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: main
            command: npm run lint && npm run test:unit && npm run build
          - group: integration
            command: npm run generate:world-db && npm run test:match-integration
          - group: career
            command: npm run generate:world-db && npm run test:match-contract && npm run test:full-career
    env:
      # Simulation parity tests keep their original time limits on a shared CPU.
      VITEST_MAX_WORKERS: '1'
      # Canonical fixed-tick fixtures allocate many short-lived state objects.
      # Give V8 more young-generation space; preserve every test and wall budget.
      NODE_OPTIONS: '--max-semi-space-size=64'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - if: matrix.group == 'main'
        run: test -f dist/data/world/pl-2026-v2.json
  historical-checks:
    name: Historical checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundations
            command: npm run benchmark:pr186:replay && npm run benchmark:pr187:replay && npm run benchmark:pr188:replay && npm run benchmark:pr189:replay && npm run benchmark:pr190:replay && npm run benchmark:pr191:baseline && npm run benchmark:pr192:baseline && npm run benchmark:pr193:baseline && npm run benchmark:pr194:baseline && npm run benchmark:pr193:replay && npm run benchmark:pr196:historical
          - group: assumptions
            command: npm run benchmark:pr195:check && npm run benchmark:pr196:check && npm run benchmark:pr196:replay
          - group: passing
            command: npm run benchmark:pr197:check && npm run benchmark:pr197:replay && npm run benchmark:pr198:check && npm run benchmark:pr198:replay
          - group: perception
            command: npm run benchmark:pr199:check && npm run benchmark:realism:check && npm run benchmark:pr200:check && npm run ci:pr201-check
    env:
      VITEST_MAX_WORKERS: '1'
      NODE_OPTIONS: '--max-semi-space-size=64'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:world-db
      - run: ${{ matrix.command }}
      - run: git diff --exit-code -- docs/performance docs/match-engine
  pr198-source:
    name: PR198 source (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [receptions, opportunities, disruption]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark:pr198:source-replay -- --case=${{ matrix.group }}
      - run: git diff --exit-code -- docs/performance docs/match-engine
  pr199-source:
    name: PR199 source (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [forensics, receivers, attributes, diagnostics]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark:pr199:source-replay -- --case=${{ matrix.group }}
      - run: git diff --exit-code -- docs/performance docs/match-engine
  pr200-source:
    name: PR200 local (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [frozen, changed, fresh, keepers, keepers-v2, diagnosis, smoke, frozen-final, fresh-final, diagnosis-final, keepers-v3, information]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark:pr200:source-replay -- --case=${{ matrix.group }}
      - run: git diff --exit-code -- docs/performance docs/match-engine
  pr200-matches:
    name: PR200 complete matches (${{ matrix.fixture }}, ${{ matrix.cohort }})
    # These exact long-match receipts were measured on Windows / Node 24.22.1.
    # Keep their full hashes; Linux remains covered by verify and platform probes.
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fixture: [ww-opportunity-driven-v1, ww-hierarchical-intent-v1, ss-opportunity-driven-v1, sw-state-value-v1, sw-contextual-judgment-v1, ww-phase-role-hybrid-v1, ss-state-value-v1]
        cohort: [current, historical]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run benchmark:pr200:source-replay -- --case=matches-${{ matrix.fixture }} --cohort=${{ matrix.cohort }}
      - if: matrix.cohort == 'current'
        run: npm run benchmark:pr201:source-replay -- --case=match-${{ matrix.fixture }}-realism-candidate-v1-v1,match-${{ matrix.fixture }}-realism-candidate-no-recovery-v1-v1
      - if: matrix.cohort == 'current'
        run: npm run benchmark:pr201:source-replay -- --baseline-runtime --case=match-${{ matrix.fixture }}-canonical-pr199-v1
      - run: git diff --exit-code -- docs/performance docs/match-engine
  pr200-platform:
    name: PR200 platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: node --experimental-transform-types --import ./scripts/registerTypescriptLoader.mjs scripts/probePr200Platform.mjs
      - if: matrix.os == 'windows-2025'
        run: npm run benchmark:pr201:source-replay
      - run: git diff --exit-code -- docs/performance docs/match-engine
  quality:
    # Preserve the existing required check and fail it if either group fails,
    # times out or is cancelled, including failures before tests can start.
    needs: [checks, historical-checks, pr198-source, pr199-source, pr200-source, pr200-matches, pr200-platform]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require every verification group
        env:
          VERIFY_RESULT: ${{ needs.checks.result }}
          HISTORICAL_RESULT: ${{ needs.historical-checks.result }}
          PR198_RESULT: ${{ needs.pr198-source.result }}
          PR199_RESULT: ${{ needs.pr199-source.result }}
          PR200_RESULT: ${{ needs.pr200-source.result }}
          PR200_MATCHES_RESULT: ${{ needs.pr200-matches.result }}
          PR200_PLATFORM_RESULT: ${{ needs.pr200-platform.result }}
        run: test "$VERIFY_RESULT" = success && test "$HISTORICAL_RESULT" = success && test "$PR198_RESULT" = success && test "$PR199_RESULT" = success && test "$PR200_RESULT" = success && test "$PR200_MATCHES_RESULT" = success && test "$PR200_PLATFORM_RESULT" = success
